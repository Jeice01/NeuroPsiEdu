name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://avfzuudrjnglqrkyxwkz.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAECdHI6cZGlT_TEu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Automated tests
        run: npm test

      - name: Dependency audit
        run: npm run audit:ci

      - name: Production build
        run: npm run build

      - name: Verify static export
        shell: bash
        run: test -f out/index.html

      - name: Upload static export
        uses: actions/upload-artifact@v7
        with:
          name: neuropsiedu-static-${{ github.sha }}
          path: out
          if-no-files-found: error
          retention-days: 7
