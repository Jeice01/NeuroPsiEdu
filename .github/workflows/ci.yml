name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://avfzuudrjnglqrkyxwkz.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAECdHI6cZGlT_TEu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: npm

      - name: Configure Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.5.6

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Automated tests
        run: npm test

      - name: Courses boundary tests
        run: node --test services/cursos/tests/registration.test.mjs services/cursos/tests/checkout.test.mjs services/cursos/tests/reconciliation.test.mjs services/cursos/tests/confirmation.test.mjs services/cursos/tests/interest.test.mjs

      - name: Courses interest capture in Google Chrome
        run: npx playwright test --config playwright.interest.config.ts

      - name: Courses recovery adapter tests
        run: deno test --allow-env services/cursos/supabase/functions/cadastro-curso/recovery_test.ts

      - name: Edge Function tests
        run: >-
          deno test --allow-env --node-modules-dir=auto
          supabase/functions/create-lead-formacao/index_test.ts

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Dependency audit
        run: npm run audit:ci

      - name: Production build
        env:
          ZULLIGER_INFORMATION_ONLY: "true"
          NEXT_PUBLIC_CURSOS_INTERESSE_ENABLED: "true"
          NEXT_PUBLIC_CURSOS_ENABLED: "false"
          NEXT_PUBLIC_CURSOS_CHECKOUT_SANDBOX_ENABLED: "false"
          NEXT_PUBLIC_CURSOS_SANDBOX_ENABLED: "true"
          NEXT_PUBLIC_CURSOS_SANDBOX_TURMA_ID: ${{ vars.CURSOS_SANDBOX_TURMA_ID }}
          NEXT_PUBLIC_CURSOS_FUNCTION_URL: https://ydmvbssgiffqrmwigkae.supabase.co/functions/v1/cadastro-curso
          NEXT_PUBLIC_CURSOS_TURNSTILE_SITE_KEY: ${{ vars.CURSOS_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_CURSOS_RECOVERY_ENABLED: "true"
          NEXT_PUBLIC_CURSOS_TERMS_VERSION: sandbox-20261003
          NEXT_PUBLIC_CURSOS_PRIVACY_VERSION: sandbox-20261003
          NEXT_PUBLIC_CURSOS_TERMS_URL: https://neuropsiedu.com.br/curso-zulliger/teste/condicoes/#termos
          NEXT_PUBLIC_CURSOS_PRIVACY_URL: https://neuropsiedu.com.br/curso-zulliger/teste/condicoes/#privacidade
        run: npm run build

      - name: Verify SEO artifact
        run: npm run test:seo

      - name: Verify informational release in Google Chrome
        run: npx playwright test --config playwright.release.config.ts

      - name: Verify performance budgets
        run: npm run test:performance

      - name: Verify static export
        shell: bash
        run: |
          test -f out/index.html
          test -f out/.htaccess

      - name: Upload static export
        uses: actions/upload-artifact@v7
        with:
          name: neuropsiedu-static-${{ github.sha }}
          path: out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
