name: Deploy Hostinger

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag ou branch a publicar
        required: true
        default: main

permissions:
  actions: read
  contents: write

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://neuropsiedu.com.br
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://avfzuudrjnglqrkyxwkz.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAECdHI6cZGlT_TEu

    steps:
      - name: Select source version
        shell: bash
        env:
          AUTOMATIC_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_REF: ${{ inputs.ref }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "DEPLOY_REF=${MANUAL_REF}" >> "${GITHUB_ENV}"
          else
            echo "DEPLOY_REF=${AUTOMATIC_SHA}" >> "${GITHUB_ENV}"
          fi

      - name: Checkout source version
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0

      - name: Record source commit
        shell: bash
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Download artifact approved by CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v7
        with:
          name: neuropsiedu-static-${{ github.event.workflow_run.head_sha }}
          path: out
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Configure Node.js for manual deployment
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: npm

      - name: Build manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm ci
          npm run build

      - name: Verify and identify artifact
        shell: bash
        run: |
          test -f out/index.html
          test -f out/.htaccess
          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg commit "${SOURCE_SHA}" \
            --arg generatedAt "${GENERATED_AT}" \
            --arg runId "${GITHUB_RUN_ID}" \
            '{commit: $commit, generatedAt: $generatedAt, runId: $runId}' \
            > out/deploy.json

      - name: Publish artifact to deploy branch
        shell: bash
        run: |
          git fetch origin deploy
          git worktree add hostinger-release origin/deploy
          find hostinger-release -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a out/. hostinger-release/
          cd hostinger-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Artifact already published."
          else
            git commit -m "deploy: ${SOURCE_SHA}"
            git push origin HEAD:deploy
          fi

      - name: Trigger Hostinger deployment
        shell: bash
        env:
          HOSTINGER_WEBHOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
        run: |
          test -n "${HOSTINGER_WEBHOOK}"
          jq -n \
            --arg after "${SOURCE_SHA}" \
            --arg ref "refs/heads/deploy" \
            --arg repository "${GITHUB_REPOSITORY}" \
            '{
              after: $after,
              ref: $ref,
              repository: {
                full_name: $repository,
                clone_url: ("https://github.com/" + $repository + ".git"),
                ssh_url: ("git@github.com:" + $repository + ".git")
              }
            }' > hostinger-push.json
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --max-time 30 \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --data-binary @hostinger-push.json \
            --output /dev/null --request POST "${HOSTINGER_WEBHOOK}"

      - name: Wait for published version
        shell: bash
        run: |
          for attempt in {1..30}; do
            PUBLISHED_SHA="$(curl --fail --silent --show-error \
              --ipv4 \
              --connect-timeout 4 \
              --max-time 8 \
              --retry 1 \
              --retry-all-errors \
              --retry-delay 1 \
              --retry-max-time 12 \
              "https://neuropsiedu.com.br/deploy.json?run=${GITHUB_RUN_ID}" \
              | jq -r '.commit // empty' 2>/dev/null || true)"
            echo "Attempt ${attempt}/30: published=${PUBLISHED_SHA:-unavailable} expected=${SOURCE_SHA}"
            if [[ "${PUBLISHED_SHA}" == "${SOURCE_SHA}" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "The expected version was not observed in production." >&2
          exit 1

      - name: Production HTTP smoke test
        shell: bash
        run: |
          for route in / /fnp/ /formacao-manuseio-arma/ /blog/ /sitemap.xml /robots.txt; do
            curl --fail --silent --show-error \
              --retry 2 --max-time 20 --output /dev/null \
              "https://neuropsiedu.com.br${route}?deploy=${GITHUB_RUN_ID}"
          done

          REDIRECT_LOCATION="$(curl --silent --show-error --head \
            --max-time 20 \
            'https://neuropsiedu.com.br/famaf/?utm_source=deploy-test' \
            | tr -d '\r' | awk 'tolower($1) == "location:" {print $2}')"
          test "${REDIRECT_LOCATION}" = "/formacao-manuseio-arma/?utm_source=deploy-test" || \
            test "${REDIRECT_LOCATION}" = "https://neuropsiedu.com.br/formacao-manuseio-arma/?utm_source=deploy-test"
